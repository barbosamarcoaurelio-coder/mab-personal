<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MAB Personal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=2.9.0">
  <title>Controle de Treinos MAB Personal</title>
  <style>
    .set-row input{font-size:16px!important}
    .mab-load-reference{grid-column:1/-1;display:block;margin-top:4px;color:#ff7a00}
    .mab-next-exercise{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;padding:8px 10px;border:1px solid #383838;border-radius:10px;background:#111}
    .mab-next-exercise strong{white-space:normal;overflow-wrap:anywhere}
    button[disabled]{opacity:.48;cursor:not-allowed}
  </style>
</head>
<body>
  <header class="topbar">
    <div><small>CONTROLE DE TREINOS</small><h1>MAB Personal</h1></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Configurações e dados">⚙</button>
  </header>
  <main id="app" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button data-route="dashboard">⌂<span>Início</span></button>
    <button data-route="workout">▶<span>Treino</span></button>
    <button data-route="plan">▦<span>Plano</span></button>
    <button data-route="exercises">≡<span>Exercícios</span></button>
    <button data-route="evolution">↗<span>Evolução</span></button>
  </nav>
  <dialog id="modal"><div id="modalContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <script type="module" src="app.js?v=2.9.0"></script>
  <script src="proximo-treino-v282.js?v=2.9.0" defer></script>
  <script type="module" src="mab-treino-v290.js?v=2.9.0"></script>
</body>
</html>
